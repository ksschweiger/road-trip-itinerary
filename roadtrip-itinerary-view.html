<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Denver to Vegas (view only)</title>
<style>
  :root{
    --ink:#25211a;
    --paper:#f3ecdc;
    --paper-soft:#ece2ca;
    --teal:#1d3b3a;
    --teal-deep:#14292a;
    --clay:#b5502c;
    --gold:#d9a441;
    --line: rgba(37,33,26,0.14);
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--teal-deep);}
  body{
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  .app{
    max-width:520px;
    margin:0 auto;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--teal-deep);
  }

  /* ---------- Top bar ---------- */
  .topbar{
    flex:0 0 auto;
    padding:18px 20px 12px;
    color:var(--paper);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  }
  .topbar .trip-name{
    font-family: Georgia, serif;
    font-size:19px;
    letter-spacing:0.02em;
  }
  .topbar .trip-dates{
    font-size:12px;
    opacity:0.65;
  }

  /* ---------- Pager ---------- */
  .pager{
    flex:1 1 auto;
    display:flex;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .pager::-webkit-scrollbar{display:none;}

  .day{
    flex:0 0 100%;
    scroll-snap-align:start;
    height:100%;
    overflow-y:auto;
    background:var(--paper);
    border-radius:18px 18px 0 0;
    padding:22px 20px 100px;
  }

  .day-eyebrow{
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    font-size:12.5px;
    color:var(--clay);
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:4px;
  }
  .day-eyebrow .today-flag{
    background:var(--clay);
    color:var(--paper);
    padding:2px 8px;
    border-radius:20px;
    font-size:10.5px;
  }
  .day-date{
    font-size:13px;
    color:var(--ink);
    opacity:0.55;
    margin-bottom:2px;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  }
  .day-title{
    font-size:27px;
    line-height:1.18;
    margin:2px 0 14px;
    font-weight:normal;
  }
  .day-title[contenteditable="true"]:focus{outline:none;border-bottom:1px dashed var(--clay);}

  .day-narrative{
    font-size:14.5px;
    line-height:1.55;
    color:var(--ink);
    opacity:0.8;
    padding-bottom:16px;
    margin-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .day-narrative[contenteditable="true"]:focus{outline:none;opacity:1;}

  /* ---------- Events ---------- */
  .events{
    list-style:none;
    margin:0;
    padding:0;
    position:relative;
  }
  .events::before{
    content:"";
    position:absolute;
    left:5px;
    top:6px;
    bottom:6px;
    width:1px;
    background:var(--line);
  }
  .event{
    position:relative;
    padding-left:26px;
    padding-right:34px;
    margin-bottom:22px;
    background:var(--paper);
  }
  .event.dragging{
    opacity:0.85;
    box-shadow:0 6px 16px rgba(37,33,26,0.18);
    border-radius:4px;
    z-index:10;
  }
  .event-drag-handle{
    position:absolute;
    right:22px;
    top:2px;
    font-size:15px;
    line-height:1;
    letter-spacing:-3px;
    color:var(--ink);
    opacity:0.3;
    cursor:grab;
    touch-action:none;
    padding:4px 6px;
    user-select:none;
  }
  .event-drag-handle:active{opacity:0.7; cursor:grabbing;}
  .event::before{
    content:"";
    position:absolute;
    left:0px;
    top:6px;
    width:11px;
    height:11px;
    border-radius:50%;
    background:var(--paper);
    border:2px solid var(--teal);
  }
  .event-time{
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--teal);
    opacity:0.75;
    margin-bottom:2px;
    min-height:14px;
  }
  .event-time[contenteditable="true"]:empty:before{
    content:"add time";
    opacity:0.4;
  }
  .event-name{
    font-size:17px;
    line-height:1.35;
    margin-bottom:3px;
  }
  .event-name[contenteditable="true"]:empty:before{
    content:"Event name";
    opacity:0.35;
  }
  .event-remove{
    position:absolute;
    right:0;
    top:2px;
    background:none;
    border:none;
    color:var(--ink);
    opacity:0.25;
    font-size:16px;
    cursor:pointer;
    line-height:1;
    padding:4px;
    font-family: Georgia, serif;
  }
  .event-remove:hover{opacity:0.7;}

  /* ---------- Extras (notes / links / locations) ---------- */
  .extras{
    list-style:none;
    margin:6px 0 0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .extra-row{
    position:relative;
    display:flex;
    align-items:flex-start;
    gap:6px;
    padding-right:44px;
  }
  .extra-row.dragging{
    opacity:0.85;
    box-shadow:0 4px 12px rgba(37,33,26,0.16);
    border-radius:4px;
    z-index:10;
  }
  .extra-icon{
    flex:0 0 auto;
    font-size:12.5px;
    opacity:0.6;
    line-height:1.5;
    padding-top:1px;
    width:14px;
  }
  .extra-content{
    flex:1 1 auto;
    min-width:0;
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    font-size:13px;
    line-height:1.5;
    color:var(--ink);
    opacity:0.7;
    white-space:pre-wrap;
  }
  .extra-content[contenteditable="true"]:empty:before{
    opacity:0.45;
  }
  .extra-row.type-note .extra-content[contenteditable="true"]:empty:before{
    content:"Note";
  }
  .extra-row.type-location .extra-content{
    color:var(--teal);
    opacity:0.85;
  }
  .extra-row.type-location .extra-content[contenteditable="true"]:empty:before{
    content:"Address for directions";
  }
  .extra-row.type-link .extra-content{
    color:var(--clay);
    text-decoration:underline;
    text-decoration-color:rgba(181,80,44,0.35);
    cursor:pointer;
  }
  .extra-action{
    flex:0 0 auto;
    background:none;
    border:none;
    font-size:13px;
    color:var(--clay);
    opacity:0.6;
    cursor:pointer;
    padding:2px 2px;
    line-height:1.5;
  }
  .extra-action:hover, .extra-action:active{opacity:1;}
  .extra-action.nudge{ animation: nudge 0.32s ease; }
  @keyframes nudge{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-2px);}
    75%{transform:translateX(2px);}
  }

  .extra-drag-handle{
    position:absolute;
    right:20px;
    top:1px;
    font-size:13px;
    line-height:1;
    letter-spacing:-2px;
    color:var(--ink);
    opacity:0.3;
    cursor:grab;
    touch-action:none;
    padding:3px 5px;
    user-select:none;
  }
  .extra-drag-handle:active{opacity:0.7; cursor:grabbing;}
  .extra-remove{
    position:absolute;
    right:0;
    top:1px;
    background:none;
    border:none;
    font-size:14px;
    color:var(--ink);
    opacity:0.3;
    cursor:pointer;
    padding:3px 4px;
    line-height:1.5;
    font-family: Georgia, serif;
  }
  .extra-remove:hover{opacity:0.7;}

  .extra-add-wrap{
    margin-top:8px;
    position:relative;
  }
  .add-extra-btn{
    background:none;
    border:1px dashed var(--line);
    color:var(--clay);
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    font-size:13px;
    width:26px;
    height:26px;
    line-height:1;
    border-radius:50%;
    cursor:pointer;
  }
  .add-extra-btn:active{background:var(--paper-soft);}
  .extra-menu{
    display:none;
    position:absolute;
    left:0;
    top:32px;
    z-index:15;
    flex-direction:column;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    box-shadow:0 6px 16px rgba(37,33,26,0.16);
    overflow:hidden;
    min-width:120px;
  }
  .extra-menu.open{
    display:flex;
  }
  .extra-menu button{
    background:none;
    border:none;
    text-align:left;
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    font-size:13.5px;
    color:var(--ink);
    padding:10px 14px;
    cursor:pointer;
  }
  .extra-menu button:not(:last-child){
    border-bottom:1px solid var(--line);
  }
  .extra-menu button:active{background:var(--paper-soft);}

  .add-event{
    margin-top:8px;
    background:none;
    border:1px dashed var(--line);
    color:var(--clay);
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    font-size:13px;
    padding:9px 14px;
    border-radius:20px;
    cursor:pointer;
  }
  .add-event:active{background:var(--paper-soft);}

  /* ---------- Bottom nav ---------- */
  .bottombar{
    flex:0 0 auto;
    padding:12px 20px calc(14px + env(safe-area-inset-bottom));
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    background:var(--teal-deep);
  }
  .navbtn{
    background:none;
    border:none;
    color:var(--paper);
    opacity:0.55;
    font-size:20px;
    padding:4px 8px;
    cursor:pointer;
    font-family: Georgia, serif;
  }
  .navbtn:disabled{opacity:0.15;cursor:default;}
  .dots{display:flex;gap:7px;}
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--paper);
    opacity:0.3;
    cursor:pointer;
    border:none;
    padding:0;
  }
  .dot.active{opacity:1;background:var(--gold);width:16px;border-radius:4px;}

  .synctag{
    position:fixed;
    top:0;left:0;right:0;
    text-align:center;
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    font-size:11px;
    color:var(--paper);
    background:var(--clay);
    padding:5px;
    transform:translateY(-100%);
    transition:transform 0.35s ease;
    z-index:20;
  }
  .synctag.show{transform:translateY(0);}
  .synctag.error{background:#8a2e20;}

  /* ---------- Modals ---------- */
  .modal-veil{
    position:fixed;inset:0;
    background:rgba(20,20,16,0.55);
    display:flex;align-items:center;justify-content:center;
    z-index:30;
    padding:24px;
  }
  .modal{
    background:var(--paper);
    border-radius:10px;
    padding:26px 24px;
    max-width:340px;
    width:100%;
    text-align:center;
  }
  .modal h2{
    font-family:Georgia, serif;
    font-weight:normal;
    font-size:21px;
    margin:0 0 6px;
  }
  .modal p{
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    font-size:13px;
    opacity:0.65;
    margin:0 0 18px;
    line-height:1.5;
  }
  .modal input{
    width:100%;
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    font-size:15px;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:6px;
    margin-bottom:12px;
    background:white;
  }
  .modal input:focus{outline:2px solid var(--clay);outline-offset:1px;}
  .modal button{
    width:100%;
    background:var(--clay);
    color:var(--paper);
    border:none;
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    font-size:14.5px;
    padding:11px;
    border-radius:6px;
    cursor:pointer;
  }
  .modal button.modal-secondary{
    background:none;
    color:var(--ink);
    opacity:0.55;
    margin-top:8px;
  }

  [contenteditable="true"]{cursor:text;}
  [contenteditable="true"]:focus{outline:none;background:var(--paper-soft);border-radius:2px;}
  [contenteditable="false"]{cursor:default;}
</style>
</head>
<body>

<div class="synctag" id="synctag">Saved</div>

<div class="app">
  <div class="topbar">
    <span class="trip-name">Denver &rarr; Vegas</span>
    <span class="trip-dates" id="tripDates">Oct 22&ndash;26</span>
  </div>

  <div class="pager" id="pager"></div>

  <div class="bottombar">
    <button class="navbtn" id="prevBtn" aria-label="Previous day">&#8249;</button>
    <div class="dots" id="dots"></div>
    <button class="navbtn" id="nextBtn" aria-label="Next day">&#8250;</button>
  </div>
</div>

<div class="modal-veil" id="nameVeil" style="display:none;">
  <div class="modal">
    <h2>Who's this?</h2>
    <p>So we can show who made each edit. No password needed.</p>
    <input id="nameInput" type="text" placeholder="Your name" maxlength="30" autofocus>
    <button id="nameSave">Continue</button>
  </div>
</div>

<div class="modal-veil" id="linkVeil" style="display:none;">
  <div class="modal">
    <h2 id="linkModalTitle">Add a link</h2>
    <input id="linkLabelInput" type="text" placeholder="Link text (e.g. Buy tickets)" maxlength="60">
    <input id="linkUrlInput" type="url" placeholder="https://example.com">
    <button id="linkConfirmBtn">Save link</button>
    <button id="linkCancelBtn" class="modal-secondary">Cancel</button>
  </div>
</div>

<script>
(function(){

  const SEED = [
    {
      date:"2026-10-22",
      title:"Denver \u2192 Glenwood Springs",
      narrative:"Land 3:00 PM, pick up rental car, scenic I-70 drive through the Rockies, dinner and overnight in Glenwood Springs.",
      events:[
        {time:"9:00 AM", name:"Fly to Denver", extras:[{type:"note", text:"Southwest"}]},
        {time:"3:00 PM", name:"Land in Denver", extras:[]},
        {time:"6:00 PM", name:"Pick up rental car", extras:[{type:"note", text:"Booked via Travelocity \u2014 Hot Springs on the way"}]},
        {time:"9:00 PM", name:"Overnight in Glenwood Springs", extras:[{type:"note", text:"VRBO"}]}
      ]
    },
    {
      date:"2026-10-23",
      title:"Glenwood Springs \u2192 Moab",
      narrative:"Leave ~6:00 AM. Morning: Mesa Arch, Grand View Point, Green River Overlook. Afternoon: Balanced Rock, Windows, Double Arch, Delicate Arch at sunset. Overnight in Moab.",
      events:[
        {time:"6:00 AM", name:"Mesa Arch", extras:[]},
        {time:"Midday", name:"Grand View Point", extras:[]},
        {time:"Afternoon", name:"Arches National Park", extras:[{type:"note", text:"$55 combined pass"}]},
        {time:"Evening", name:"Overnight in Moab", extras:[{type:"note", text:"VRBO"}]}
      ]
    },
    {
      date:"2026-10-24",
      title:"Moab \u2192 Tooele",
      narrative:"Sunrise at Dead Horse Point, scenic UT-128 or Corona Arch hike. Depart early afternoon and drive to Tooele.",
      events:[
        {time:"Morning", name:"Canyonlands National Park", extras:[{type:"note", text:"$55 combined pass"}]},
        {time:"Afternoon", name:"Drive to Tooele", extras:[]},
        {time:"Evening", name:"Bonneville Salt Flats", extras:[]},
        {time:"Night", name:"Overnight in Tooele", extras:[{type:"note", text:"VRBO"}]}
      ]
    },
    {
      date:"2026-10-25",
      title:"Tooele \u2192 Las Vegas",
      narrative:"Morning horse viewing, late morning at Salt Flats, lunch in Wendover, optional Valley of Fire, arrive Las Vegas evening.",
      events:[
        {time:"Midday", name:"Onaqui Wild Horses", extras:[]},
        {time:"6:00 PM", name:"Check in \u2014 Excalibur", extras:[{type:"note", text:"MGM"}]},
        {time:"8:00 PM", name:"Wizard of Oz", extras:[{type:"note", text:"SeatGeek / Ticketmaster"}]}
      ]
    },
    {
      date:"2026-10-26",
      title:"Las Vegas",
      narrative:"Relax and fly home.",
      events:[
        {time:"Midday", name:"Fly to DTW", extras:[{type:"note", text:"Southwest"}]}
      ]
    }
  ];

  const NAME_KEY = "roadtrip-vegas-username-v1";

  const JSONBIN_ID = "6aa963adac6210605ad0ee9d";
  const JSONBIN_KEY = "$2a$10$jJazxmX5NBU61UhW6pEhL./sUw50BotFpjcYqgZFRXvsw12IVe7g.";
  const JSONBIN_URL = "https://api.jsonbin.io/v3/b/" + JSONBIN_ID;

  const READONLY = true; // this file is the permanent view-only copy

  async function loadItinerary(){
    const res = await fetch(JSONBIN_URL + "/latest", {
      headers: { "X-Access-Key": JSONBIN_KEY }
    });
    if (!res.ok) throw new Error("load failed: " + res.status);
    const json = await res.json();
    return json.record;
  }

  async function saveItinerary(dataObj){
    const res = await fetch(JSONBIN_URL, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Access-Key": JSONBIN_KEY
      },
      body: JSON.stringify(dataObj)
    });
    if (!res.ok) throw new Error("save failed: " + res.status);
    return res.json();
  }

  let days = null;
  let currentIndex = 0;
  let myName = null;
  let saveTimer = null;

  const pager = document.getElementById('pager');
  const dotsEl = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const synctag = document.getElementById('synctag');
  const nameVeil = document.getElementById('nameVeil');
  const nameInput = document.getElementById('nameInput');
  const nameSave = document.getElementById('nameSave');

  function makeId(){
    return 'e' + Math.random().toString(36).slice(2, 9);
  }

  function ensureIds(){
    days.forEach(day => day.events.forEach(ev => {
      if (!ev.id) ev.id = makeId();
      if (!ev.extras) ev.extras = [];
      ev.extras.forEach(x => { if (!x.id) x.id = makeId(); });
    }));
  }

  // ---- Generic drag-to-reorder, used for both events and extras ----
  function beginDrag(e, item, container, getId, onFinish){
    if (READONLY) return;
    e.preventDefault();
    try{ e.target.setPointerCapture(e.pointerId); }catch(err){}
    item.classList.add('dragging');

    function onMove(ev){
      const y = ev.clientY;
      const siblings = Array.from(container.children).filter(el => el !== item);
      let placed = false;
      for (const sib of siblings){
        const r = sib.getBoundingClientRect();
        const mid = r.top + r.height / 2;
        if (y < mid){
          container.insertBefore(item, sib);
          placed = true;
          break;
        }
      }
      if (!placed && siblings.length){
        container.insertBefore(item, siblings[siblings.length - 1].nextSibling);
      }
    }

    function onUp(){
      item.classList.remove('dragging');
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      const idsInOrder = Array.from(container.children).map(getId);
      onFinish(idsInOrder);
    }

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  }

  // ---- Link modal (used only for adding/editing the "Link" extra) ----
  let linkModalCtx = null; // { day, ev, ul, di, editingId }

  const linkVeil = document.getElementById('linkVeil');
  const linkLabelInput = document.getElementById('linkLabelInput');
  const linkUrlInput = document.getElementById('linkUrlInput');
  const linkModalTitle = document.getElementById('linkModalTitle');
  const linkConfirmBtn = document.getElementById('linkConfirmBtn');
  const linkCancelBtn = document.getElementById('linkCancelBtn');

  function openLinkModal(day, ev, ul, di, existing){
    linkModalCtx = { day, ev, ul, di, editingId: existing ? existing.id : null };
    linkModalTitle.textContent = existing ? 'Edit link' : 'Add a link';
    linkLabelInput.value = existing ? (existing.label || '') : '';
    linkUrlInput.value = existing ? (existing.url || '') : 'https://';
    linkVeil.style.display = 'flex';
    requestAnimationFrame(()=>{ linkLabelInput.focus(); });
  }

  function closeLinkModal(){
    linkVeil.style.display = 'none';
    linkModalCtx = null;
  }

  function confirmLink(){
    if (!linkModalCtx) { closeLinkModal(); return; }
    const rawUrl = linkUrlInput.value.trim();
    if (!rawUrl){ closeLinkModal(); return; }
    const href = /^https?:\/\//i.test(rawUrl) ? rawUrl : 'https://' + rawUrl;
    const label = linkLabelInput.value.trim() || href;
    const { day, ev, ul, di, editingId } = linkModalCtx;

    if (editingId){
      const item = ev.extras.find(x => x.id === editingId);
      if (item){ item.label = label; item.url = href; }
    } else {
      ev.extras.push({ id: makeId(), type: 'link', label, url: href });
    }
    scheduleSave();
    rerenderDay(day, ul, di);
    closeLinkModal();
  }

  linkConfirmBtn.addEventListener('click', confirmLink);
  linkCancelBtn.addEventListener('click', closeLinkModal);
  linkUrlInput.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') confirmLink(); });
  linkLabelInput.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') confirmLink(); });

  function fmtDateShort(iso){
    const d = new Date(iso + "T12:00:00");
    return d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
  }

  function pickDefaultIndex(list){
    const today = new Date();
    const todayStr = today.toISOString().slice(0,10);
    let idx = list.findIndex(d => d.date === todayStr);
    if (idx !== -1) return idx;
    if (todayStr < list[0].date) return 0;
    if (todayStr > list[list.length-1].date) return list.length - 1;
    for (let i=0;i<list.length;i++){
      if (list[i].date >= todayStr) return i;
    }
    return 0;
  }

  function showStatus(text, isError, duration){
    synctag.textContent = text;
    synctag.classList.toggle('error', !!isError);
    synctag.classList.add('show');
    clearTimeout(showStatus._t);
    showStatus._t = setTimeout(()=>synctag.classList.remove('show'), duration || 1200);
  }

  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{
      try{
        await saveItinerary({days, lastEditedBy: myName, lastEditedAt: Date.now()});
        showStatus('Saved', false, 1200);
      }catch(e){
        console.error('save failed', e);
        showStatus("Couldn't save \u2014 check connection", true, 2500);
      }
    }, 500);
  }

  // ---- Extra row builders ----
  function buildExtraRow(day, ev, extra, ul, di, extrasEl){
    const row = document.createElement('li');
    row.className = 'extra-row type-' + extra.type;
    row.dataset.extraId = extra.id;

    const icon = document.createElement('span');
    icon.className = 'extra-icon';
    icon.textContent = extra.type === 'link' ? '\u{1F517}' : (extra.type === 'location' ? '\u{1F4CD}' : '');
    row.appendChild(icon);

    if (extra.type === 'note'){
      const content = document.createElement('div');
      content.className = 'extra-content';
      content.contentEditable = READONLY ? 'false' : 'true';
      content.textContent = extra.text || '';
      content.addEventListener('keydown', (e)=>{
        if (e.key === 'Enter'){ e.preventDefault(); document.execCommand('insertLineBreak'); }
      });
      content.addEventListener('input', ()=>{ extra.text = content.innerText; scheduleSave(); });
      row.appendChild(content);
    } else if (extra.type === 'location'){
      const content = document.createElement('div');
      content.className = 'extra-content';
      content.contentEditable = READONLY ? 'false' : 'true';
      content.textContent = extra.address || '';
      content.addEventListener('input', ()=>{ extra.address = content.textContent; scheduleSave(); });
      row.appendChild(content);

      const openBtn = document.createElement('button');
      openBtn.className = 'extra-action';
      openBtn.innerHTML = '&#8599;';
      openBtn.setAttribute('aria-label', 'Open driving directions in Google Maps');
      openBtn.addEventListener('click', ()=>{
        const a = (extra.address || '').trim();
        if (!a){
          openBtn.classList.remove('nudge');
          void openBtn.offsetWidth;
          openBtn.classList.add('nudge');
          return;
        }
        const url = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(a) + '&travelmode=driving';
        window.open(url, '_blank', 'noopener,noreferrer');
      });
      row.appendChild(openBtn);
    } else if (extra.type === 'link'){
      const content = document.createElement('div');
      content.className = 'extra-content';
      content.textContent = extra.label || extra.url || '';
      if (!READONLY){
        content.addEventListener('click', ()=> openLinkModal(day, ev, ul, di, extra));
      }
      row.appendChild(content);

      const openBtn = document.createElement('button');
      openBtn.className = 'extra-action';
      openBtn.innerHTML = '&#8599;';
      openBtn.setAttribute('aria-label', 'Open link');
      openBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        if (extra.url) window.open(extra.url, '_blank', 'noopener,noreferrer');
      });
      row.appendChild(openBtn);
    }

    if (!READONLY){
      const handle = document.createElement('span');
      handle.className = 'extra-drag-handle';
      handle.innerHTML = '&#8942;&#8942;';
      handle.setAttribute('aria-label', 'Drag to reorder');
      handle.addEventListener('pointerdown', (e)=>{
        beginDrag(e, row, extrasEl, el => el.dataset.extraId, (idsInOrder)=>{
          const idToExtra = {};
          ev.extras.forEach(x => { idToExtra[x.id] = x; });
          ev.extras = idsInOrder.map(id => idToExtra[id]).filter(Boolean);
          scheduleSave();
        });
      });
      row.appendChild(handle);

      const rm = document.createElement('button');
      rm.className = 'extra-remove';
      rm.innerHTML = '&times;';
      rm.setAttribute('aria-label', 'Remove');
      rm.addEventListener('click', ()=>{
        ev.extras = ev.extras.filter(x => x.id !== extra.id);
        scheduleSave();
        rerenderDay(day, ul, di);
      });
      row.appendChild(rm);
    }

    return row;
  }

  function buildEventLi(day, ev, di, ul){
    const li = document.createElement('li');
    li.className = 'event';
    li.dataset.id = ev.id;

    if (!READONLY){
      const rm = document.createElement('button');
      rm.className = 'event-remove';
      rm.innerHTML = '&times;';
      rm.setAttribute('aria-label','Remove event');
      rm.addEventListener('click', ()=>{
        day.events = day.events.filter(e2 => e2.id !== ev.id);
        scheduleSave();
        rerenderDay(day, ul, di);
      });
      li.appendChild(rm);

      const handle = document.createElement('span');
      handle.className = 'event-drag-handle';
      handle.innerHTML = '&#8942;&#8942;';
      handle.setAttribute('aria-label', 'Drag to reorder');
      handle.addEventListener('pointerdown', (e)=>{
        beginDrag(e, li, ul, el => el.dataset.id, (idsInOrder)=>{
          const idToEvent = {};
          day.events.forEach(e2 => { idToEvent[e2.id] = e2; });
          day.events = idsInOrder.map(id => idToEvent[id]).filter(Boolean);
          scheduleSave();
        });
      });
      li.appendChild(handle);
    }

    const t = document.createElement('div');
    t.className = 'event-time';
    t.contentEditable = READONLY ? 'false' : 'true';
    t.textContent = ev.time || '';
    t.addEventListener('input', ()=>{ ev.time = t.textContent; scheduleSave(); });
    li.appendChild(t);

    const n = document.createElement('div');
    n.className = 'event-name';
    n.contentEditable = READONLY ? 'false' : 'true';
    n.textContent = ev.name || '';
    n.addEventListener('input', ()=>{ ev.name = n.textContent; scheduleSave(); });
    li.appendChild(n);

    const extrasEl = document.createElement('ul');
    extrasEl.className = 'extras';
    (ev.extras || []).forEach(extra => {
      extrasEl.appendChild(buildExtraRow(day, ev, extra, ul, di, extrasEl));
    });
    li.appendChild(extrasEl);

    if (!READONLY){
      const addWrap = document.createElement('div');
      addWrap.className = 'extra-add-wrap';

      const addExtraBtn = document.createElement('button');
      addExtraBtn.className = 'add-extra-btn';
      addExtraBtn.textContent = '+';
      addExtraBtn.setAttribute('aria-label', 'Add note, link, or location');

      const menu = document.createElement('div');
      menu.className = 'extra-menu';

      const noteBtn = document.createElement('button');
      noteBtn.textContent = 'Note';
      noteBtn.addEventListener('click', ()=>{
        const newExtra = { id: makeId(), type:'note', text:'' };
        ev.extras.push(newExtra);
        scheduleSave();
        rerenderDay(day, ul, di);
        requestAnimationFrame(()=>{
          const row = ul.querySelector('li[data-id="' + ev.id + '"] li[data-extra-id="' + newExtra.id + '"]');
          const f = row && row.querySelector('.extra-content');
          if (f) f.focus();
        });
      });
      menu.appendChild(noteBtn);

      const linkBtn = document.createElement('button');
      linkBtn.textContent = 'Link';
      linkBtn.addEventListener('click', ()=> openLinkModal(day, ev, ul, di, null));
      menu.appendChild(linkBtn);

      const locBtn = document.createElement('button');
      locBtn.textContent = 'Location';
      locBtn.addEventListener('click', ()=>{
        const newExtra = { id: makeId(), type:'location', address:'' };
        ev.extras.push(newExtra);
        scheduleSave();
        rerenderDay(day, ul, di);
        requestAnimationFrame(()=>{
          const row = ul.querySelector('li[data-id="' + ev.id + '"] li[data-extra-id="' + newExtra.id + '"]');
          const f = row && row.querySelector('.extra-content');
          if (f) f.focus();
        });
      });
      menu.appendChild(locBtn);

      addExtraBtn.addEventListener('click', ()=> menu.classList.toggle('open'));

      addWrap.appendChild(addExtraBtn);
      addWrap.appendChild(menu);
      li.appendChild(addWrap);
    }

    return li;
  }

  function renderEventsInto(ul, day, di){
    ul.innerHTML = '';
    day.events.forEach(ev => { ul.appendChild(buildEventLi(day, ev, di, ul)); });
  }

  function rerenderDay(day, ul, di){
    renderEventsInto(ul, day, di);
  }

  function render(){
    pager.innerHTML = '';
    dotsEl.innerHTML = '';
    const todayStr = new Date().toISOString().slice(0,10);

    days.forEach((day, di)=>{
      const sec = document.createElement('section');
      sec.className = 'day';

      const eyebrow = document.createElement('div');
      eyebrow.className = 'day-eyebrow';
      const label = document.createElement('span');
      label.textContent = `Day ${di+1} of ${days.length}`;
      eyebrow.appendChild(label);
      if (day.date === todayStr){
        const flag = document.createElement('span');
        flag.className = 'today-flag';
        flag.textContent = 'Today';
        eyebrow.appendChild(flag);
      }
      sec.appendChild(eyebrow);

      const dateEl = document.createElement('div');
      dateEl.className = 'day-date';
      dateEl.textContent = fmtDateShort(day.date);
      sec.appendChild(dateEl);

      const titleEl = document.createElement('h1');
      titleEl.className = 'day-title';
      titleEl.contentEditable = READONLY ? 'false' : 'true';
      titleEl.textContent = day.title;
      titleEl.addEventListener('input', ()=>{ day.title = titleEl.textContent; scheduleSave(); });
      sec.appendChild(titleEl);

      const narrEl = document.createElement('div');
      narrEl.className = 'day-narrative';
      narrEl.contentEditable = READONLY ? 'false' : 'true';
      narrEl.textContent = day.narrative || '';
      narrEl.addEventListener('input', ()=>{ day.narrative = narrEl.textContent; scheduleSave(); });
      sec.appendChild(narrEl);

      const ul = document.createElement('ul');
      ul.className = 'events';
      renderEventsInto(ul, day, di);
      sec.appendChild(ul);

      if (!READONLY){
        const addBtn = document.createElement('button');
        addBtn.className = 'add-event';
        addBtn.textContent = '+ Add event';
        addBtn.addEventListener('click', ()=>{
          const newEv = { id: makeId(), time:'', name:'', extras:[] };
          day.events.push(newEv);
          scheduleSave();
          rerenderDay(day, ul, di);
          requestAnimationFrame(()=>{
            const newLi = ul.querySelector('li[data-id="' + newEv.id + '"]');
            const f = newLi && newLi.querySelector('.event-name');
            if (f) f.focus();
          });
        });
        sec.appendChild(addBtn);
      }

      pager.appendChild(sec);

      const dot = document.createElement('button');
      dot.className = 'dot' + (di===currentIndex ? ' active' : '');
      dot.addEventListener('click', ()=> goTo(di));
      dotsEl.appendChild(dot);
    });

    updateNavButtons();
  }

  function updateNavButtons(){
    prevBtn.disabled = currentIndex <= 0;
    nextBtn.disabled = currentIndex >= days.length - 1;
    Array.from(dotsEl.children).forEach((d,i)=> d.classList.toggle('active', i===currentIndex));
  }

  function goTo(i){
    i = Math.max(0, Math.min(days.length-1, i));
    currentIndex = i;
    const secs = pager.querySelectorAll('.day');
    secs[i].scrollIntoView({behavior:'smooth', inline:'start', block:'nearest'});
    updateNavButtons();
  }

  pager.addEventListener('scroll', ()=>{
    clearTimeout(pager._t);
    pager._t = setTimeout(()=>{
      const w = pager.clientWidth;
      const i = Math.round(pager.scrollLeft / w);
      if (i !== currentIndex && i>=0 && i<days.length){
        currentIndex = i;
        updateNavButtons();
      }
    }, 80);
  });

  prevBtn.addEventListener('click', ()=> goTo(currentIndex-1));
  nextBtn.addEventListener('click', ()=> goTo(currentIndex+1));

  async function init(){
    // name — plain browser localStorage, per device, no account needed
    try{
      myName = localStorage.getItem(NAME_KEY);
    }catch(e){ myName = null; }

    if (!myName && !READONLY){
      nameVeil.style.display = 'flex';
      nameInput.focus();
    }

    // shared itinerary data — jsonbin.io
    try{
      const record = await loadItinerary();
      days = (record && record.days && record.days.length) ? record.days : SEED;
      if (!record || !record.days || !record.days.length){
        await saveItinerary({days: SEED, lastEditedBy: null, lastEditedAt: Date.now()});
      }
    }catch(e){
      console.error('load failed, showing default itinerary', e);
      days = SEED;
      showStatus("Couldn't load latest \u2014 showing default", true, 3000);
    }

    ensureIds();
    currentIndex = pickDefaultIndex(days);
    render();

    requestAnimationFrame(()=>{
      const secs = pager.querySelectorAll('.day');
      if (secs[currentIndex]) secs[currentIndex].scrollIntoView({inline:'start'});
    });
  }

  nameSave.addEventListener('click', saveName);
  nameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') saveName(); });
  async function saveName(){
    const v = nameInput.value.trim();
    if (!v) return;
    myName = v;
    try{ localStorage.setItem(NAME_KEY, v); }catch(e){}
    nameVeil.style.display = 'none';
  }

  init();
})();
</script>
</body>
</html>
